name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by changelogithub to create the GitHub release
      id-token: write # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # changelogithub needs the full history to collect commits

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for file in packages/glowglow/package.json packages/react/package.json packages/vue/package.json; do
            pkg="$(node -p "require('./$file').version")"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::Tag v$tag does not match $file version $pkg"
              exit 1
            fi
          done
          echo "Releasing v$tag"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Generates the GitHub release from conventional commits since the last tag.
      # Non-fatal: a changelog hiccup should not block the npm publish.
      - name: Create GitHub release
        run: npx changelogithub@15
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `prepublishOnly` runs the build, so dist/ is always fresh in each
      # tarball. Adapters must use pnpm: it rewrites their `workspace:^`
      # dependency to a real semver range.
      - name: Publish @glowglow/core
        run: |
          version="$(node -p "require('./packages/glowglow/package.json').version")"
          if npm view "@glowglow/core@$version" version >/dev/null 2>&1; then
            echo "@glowglow/core@$version is already published"
          else
            pnpm --filter @glowglow/core publish --provenance --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @glowglow/react
        run: |
          version="$(node -p "require('./packages/react/package.json').version")"
          if npm view "@glowglow/react@$version" version >/dev/null 2>&1; then
            echo "@glowglow/react@$version is already published"
          else
            pnpm --filter @glowglow/react publish --provenance --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @glowglow/vue
        run: |
          version="$(node -p "require('./packages/vue/package.json').version")"
          if npm view "@glowglow/vue@$version" version >/dev/null 2>&1; then
            echo "@glowglow/vue@$version is already published"
          else
            pnpm --filter @glowglow/vue publish --provenance --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
