name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Coverage
        run: pnpm coverage

      - name: Build
        run: pnpm build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/glowglow/dist/
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest 5 requires Node >= 22.12; Node 18 is covered by the runtime
        # job below, which exercises the built package instead.
        node:
          - 22
          - 24
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  # The dev toolchain cannot run on the oldest Node version the package
  # supports: pnpm 11 needs Node >= 22.13 and Vitest 5 needs Node >= 22.12.
  # This job checks the thing engines actually promises — the built package —
  # on Node 18, without installing any development dependencies.
  runtime:
    name: Runtime (Node ${{ matrix.node }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages/glowglow/dist

      - name: Run runtime smoke test
        run: node packages/glowglow/test/runtime-smoke.mjs

  browser:
    name: Browser check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drives the built editor over the DevTools Protocol. Chrome is preinstalled
      # on GitHub-hosted Ubuntu runners; the script also falls back to other
      # common paths when CHROME_PATH is unset.
      - name: Run browser check
        run: pnpm test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
